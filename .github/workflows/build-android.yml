name: Build Kyuby Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'vite.config.mobile.js'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build de la web empaquetada dentro del APK (sin base de GitHub Pages, sin service worker)
      - run: npm run build:mobile
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Nota: no usamos android-actions/setup-android (acción de un tercero,
      # sin mantenimiento y con fallos frecuentes al descargar el SDK).
      # Los runners "ubuntu-latest" de GitHub ya traen el Android SDK
      # preinstalado (ANDROID_HOME configurado), así que Gradle lo detecta solo.

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (debug, listo para instalar)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: kyuby-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
